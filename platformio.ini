; VeeTee 2350 — see STYLE.md §1 for why these choices were made.

[platformio]
default_envs = pizero

[env:pizero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_pizero
framework = arduino
board_build.core = earlephilhower
; DVI 640x480p60 needs sysclk = 10 x 25.2 MHz pixel clock. arduino-pico sets
; this clock at boot; hal/video.c then raises VREG to 1.20 V and checks it.
board_build.f_cpu = 252000000L
; Two CDC ports enumerate; only the line port (CDC 0, interface 0) honours
; the 1200-baud "touch" that reboots into BOOTSEL for upload. On macOS its
; device name ends in 1 (the keyboard port, interface 2, ends in 3).
upload_port = /dev/cu.usbmodem*1
build_unflags = -std=gnu17 -std=gnu11 -std=c17
build_flags = -std=gnu23 -Wall -Wextra -Iinclude
    ; lib/term reads libvterm's internal state (modes, margins); vendored.
    -Ilib/libvterm/src -Ilib/libvterm/include
    ; Adafruit TinyUSB instead of the core's native USB: the native stack
    ; is compiled for one CDC port and we need two (line + keyboard).
    -DUSE_TINYUSB
    ; libdvi configuration (lib/PicoDVI/src/dvi_config_defs.h): full-res
    ; 640-pixel lines, no line doubling, two TMDS symbols per FIFO word and
    ; an unrolled SIO encode loop (both measured necessary to fit the
    ; 8000-cycle line budget; see lib/hal/video.c).
    -DDVI_VERTICAL_REPEAT=1
    -DDVI_SYMBOLS_PER_WORD=2
    -DDVI_N_TMDS_BUFFERS=4
    -DTMDS_ENCODE_UNROLL=4

; Same firmware plus once-a-second pipeline statistics on the serial port
; (see report_stats() in src/app.c). For measurement, not for use.
[env:pizero-stats]
extends = env:pizero
build_flags = ${env:pizero.build_flags} -DVEETEE_SERIAL_STATS

; Firmware that measures which QSPI flash RX delays read correctly at the
; selected mode's clock and prints the result on the boot banner.
[env:pizero-flashprobe]
extends = env:pizero
build_flags = ${env:pizero.build_flags} -DVEETEE_FLASH_PROBE

; Host build for unit tests of the pure modules (STYLE.md §4). Hardware
; libraries are excluded; anything that pulls them in is a layering bug.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu23 -Wall -Wextra -Iinclude -Ilib/libvterm/src
    -Ilib/libvterm/include
lib_ignore = hal, PicoDVI
lib_ldf_mode = deep+
